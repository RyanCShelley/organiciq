# What runs before anything reaches production.
#
# Nothing did: roughly 1,450 tests, a type check and a lint config existed and
# nothing ran them on push, so a broken migration or a 404 reached Railway and
# Vercel unverified. These two jobs run what the project already has.
#
# This workflow reports; it does not stop a deploy. Railway and Vercel build
# from the push on their own. To make a red run block a deploy, turn on
# "Wait for CI" in the Railway service settings and require this workflow's
# checks on the main branch in GitHub. Neither can be set from a file.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The suite builds its own schema, so it needs an empty database it may
      # drop. Production is the default environment and refuses development
      # secrets; tests are not production.
      APP_ENV: test
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/organiciq_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/api/requirements*.txt
      - run: pip install -r requirements-dev.txt
      # Includes test_schema_matches_migrations: a model column with no
      # migration is invisible to every other test and broke a sync for weeks.
      - run: python -m pytest -q

  web:
    name: Web checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  advisories:
    name: Dependency advisories
    runs-on: ubuntu-latest
    # Reported, not blocking: a new advisory on an unrelated package should
    # not stop a fix from shipping, but it should be visible.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: npm audit (production dependencies)
        working-directory: apps/web
        run: npm audit --omit=dev
      - name: pip-audit
        # Runs even when the npm step reported something: they are separate
        # reports and the first one finding advisories must not hide the second.
        if: always()
        working-directory: apps/api
        run: pip install pip-audit && pip-audit -r requirements.txt
