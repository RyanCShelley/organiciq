# Railway service config for the Organic IQ API.
# Create a second Railway service from the same Dockerfile with:
#   Custom Start Command: scripts/start-worker.sh
#
# Root Directory / Dockerfile path: apps/api

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "scripts/start-api.sh"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
