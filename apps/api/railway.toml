# Shared by API + worker (same Dockerfile under apps/api).
# Worker service: set SERVICE_ROLE=worker and do NOT set a healthcheck path
# (worker has no HTTP server). API service keeps healthcheck in the Railway UI.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "scripts/start.sh"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
